[project]
name = "adakoop"
version = "0.2.0"
description = "AdaKoop: Efficient Modeling of Nonlinear Dynamics from Nonstationary Data Streams with Koopman Operator Regression"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "hydra-core>=1.3.2",
  "seaborn>=0.13.2",
  "notebook>=7.4.7",
  "scikit-learn>=1.7.2",
  "tqdm>=4.67.1",
  "tabulate>=0.9.0",
  "hydra-core>=1.3.2",
  "dysts==0.8",
]

[dependency-groups]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "ruff==0.6.9",
    "mypy==1.11.1",
]

[tool.ruff]
target-version = "py312"
line-length = 119
ignore = ["E741"]

[tool.ruff.lint]
select = ["E", "W", "F", "C"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.mccabe]
max-complexity = 24

[tool.mypy]
show_error_context = true
show_column_numbers = true
ignore_missing_imports = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.sphinx-pyproject]
project = "adakoop"
copyright = "2026, Naoki Chihara"
language = "en"
package_root = "adakoop"
html_theme = "sphinx_rtd_theme"
todo_include_todos = true
templates_path = ["_templates"]
html_static_path = ["_static"]
extensions = [
  "sphinx.ext.autodoc",
  "sphinx.ext.viewcode",
  "sphinx.ext.todo",
  "sphinx.ext.napoleon",
]
