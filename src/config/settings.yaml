hydra:
  run:
    dir: out/logs/${now:%Y-%m-%d} # /${now:%H-%M-%S}
  sweep:
    dir: out/logs/${now:%Y-%m-%d}/multirun # /${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    chdir: False
  job_logging:
    version: 1
    handlers:
      console:
        class: logging.StreamHandler
        stream: ext://sys.stdout
    formatters:
      simple:
        format: '%(message)s'

defaults:
  - _self_
  - model: adakoop

io:
  input_dir: ???
  out_dir: out/
  root_out_dir: out/

data:
  fn: ???
  n: 1000
  # preprocessing of input data
  moving_average: 1
  logarithm: False
  scaling_kind: minmax  # [none, zscore, minmax, normalize]
  whitenoise: 0

exp:
  mode: run
  seed: 19
  iterations: 1
  n_workers: 1

use_gpu: False
use_multi_gpu: False
devices: "0,1,2,3"
save: True
verbose: True
